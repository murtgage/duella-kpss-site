<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Linear gradient for the letter -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="15%" stop-color="#FF8C00"/>
      <stop offset="30%" stop-color="#FF1493"/>
      <stop offset="45%" stop-color="#8A2BE2"/>
      <stop offset="60%" stop-color="#00BFFF"/>
      <stop offset="75%" stop-color="#00FF7F"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Glossy/3D filter -->
    <filter id="glossy3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2"/>
      <feSpecularLighting in="Blur" lighting-color="rgba(255,255,255,0.8)" angle="-30" glossiness="0.5">
        <fePointLight x="-100" y="-50" z="100"/>
      </feSpecularLighting>
      <feComposite in="SourceAlpha" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Main "d" letter with gradient and 3D glossy effect -->
  <text x="100" y="130" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="80" font-weight="700" fill="url(#logoGrad)" filter="url(#glossy3d)" text-anchor="middle">
    D
  </text>

  <!-- Subtle shadow for 3D feel -->
  <text x="102" y="132" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="80" font-weight="700" fill="rgba(0,0,0,0.3)" filter="url(#shadow)" text-anchor="middle">
    D
  </text>
</svg>